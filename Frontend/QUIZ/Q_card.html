<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Generator</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <main class="split-main">
        <section id="quiz-setup-container" class="split-left">
            <h2>Generate Your Quiz</h2>
            <form id="quiz-setup-form">
                <label for="question-type">Question Type:</label>
                <select id="question-type" name="question-type" required>
                    <option value="mcq">MCQ</option>
                    <option value="analytical">Analytical</option>
                    <option value="descriptive">Descriptive</option>
                </select>
                <label for="topic">Topic:</label>
                <select id="topic" name="topic" required>
                    <option value="Current Affairs">Current Affairs</option>
                    <option value="International News">International News</option>
                    <option value="Science">Science</option>
                    <option value="Sports">Sports</option>
                    <option value="Economy">Economy</option>
                </select>
                <label for="exam-type">Type of Questions:</label>
                <select id="exam-type" name="exam-type" required>
                    <option value="UPSE">UPSE</option>
                    <option value="PCS">PCS</option>
                    <option value="Normal">Normal</option>
                </select>
                <button type="submit" id="generate-btn">Generate Questions</button>
            </form>
        </section>
        <section id="questions-container" class="split-right">
            <h2>Your Quiz Questions</h2>
            <div id="questions-list"></div>
        </section>
    </main>
    <script src="script1.js"></script>
</body>
</html>
